name: Daily Wall Street Stock Analysis Update

# 실행 조건 (트리거)
on:
  schedule:
    # 매일 UTC 기준 21:00 (한국 시간 KST 오전 06:00)에 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # Actions 탭에서 수동으로 '지금 실행' 버튼을 누를 수 있게 해주는 옵션

jobs:
  update-stocks:
    runs-on: ubuntu-latest # 최신 우분투 가상 컴퓨터 대여

    steps:
      # 1. 저장소의 코드(daily_updater.py, requirements.txt 등)를 가상 컴퓨터로 가져오기
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. 파이썬 3.10 환경 세팅
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 패키지 캐싱으로 속도 단축

      # 3. 필요한 라이브러리 설치
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 일일 업데이트 파이썬 스크립트 실행 (환경변수로 Supabase 키 주입)
      - name: Run Daily Stock Analysis Batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python daily_updater.py
